# TUI Launcher — command config
# Format:
#   [Group Name]
#   short_name = full command to run
#
# Lines starting with # are comments and are ignored.

[Docker]
ps      = docker ps -a
prune   = docker system prune -f

[Git]
st    = git status
log   = git log --oneline -15
diff  = git diff
push  = git push origin HEAD
ship  = bash -c 'read -rp "Commit message (max 13 words): " m && git add . && git commit -m "$m" && git push origin HEAD'

[Multipass]
list  = multipass list
info  = multipass info --all
shell = bash -c 'multipass list; read -rp "VM name: " n && multipass shell "$n"'
stop  = bash -c 'multipass list; read -rp "VM name: " n && multipass stop "$n"'
new = bash -c 'read -rp "Name: " n; read -rp "CPUs [2]: " c; read -rp "Memory [4G]: " m; read -rp "Disk [8G]: " d; multipass launch --name "$n" --cpus "${c:-2}" --memory "${m:-4G}" --disk "${d:-8G}" && mkdir -p "$HOME/.mp_$n" && multipass mount "$HOME/.mp_$n" "$n:/home/ubuntu/host_drive"'
new + prometheus = bash -c 'read -rp "Name: " n; read -rp "CPUs [2]: " c; read -rp "Memory [4G]: " m; read -rp "Disk [8G]: " d; SCRIPTS="${XDG_CONFIG_HOME:-$HOME/.config}/unix-manager/scripts"; multipass launch --name "$n" --cpus "${c:-2}" --memory "${m:-4G}" --disk "${d:-8G}" && mkdir -p "$HOME/.mp_$n" && multipass mount "$HOME/.mp_$n" "$n:/home/ubuntu/host_drive" && multipass transfer "$SCRIPTS/install_node_exporter.sh" "$n:/tmp/install_node_exporter.sh" && multipass exec "$n" -- bash /tmp/install_node_exporter.sh'
stop all = bash -c 'multipass list; read -rp "Stop ALL VMs? [y/N] " a && [[ "${a,,}" == "y" ]] && multipass stop --all && echo "All VMs stopped." || echo "Aborted."'

[Prometheus]
install = bash -c 'multipass list; read -rp "VM name: " n; SCRIPTS="${XDG_CONFIG_HOME:-$HOME/.config}/unix-manager/scripts"; multipass transfer "$SCRIPTS/install_node_exporter.sh" "$n:/tmp/install_node_exporter.sh" && multipass exec "$n" -- bash /tmp/install_node_exporter.sh'
status  = bash -c 'multipass list; read -rp "VM name: " n && multipass exec "$n" -- systemctl --no-pager status prometheus-node-exporter'
upgrade = bash -c 'multipass list; read -rp "VM name: " n && multipass exec "$n" -- sudo bash -c "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --only-upgrade prometheus-node-exporter && systemctl restart prometheus-node-exporter && prometheus-node-exporter --version 2>&1 | head -n 1"'
metrics = bash -c 'multipass list; read -rp "VM name: " n && multipass exec "$n" -- curl -s http://localhost:9100/metrics | grep -E "^(node_boot_time_seconds|node_load1|node_memory_MemAvailable_bytes|node_filesystem_avail_bytes)" '
remove  = bash -c 'multipass list; read -rp "VM name: " n; read -rp "Remove prometheus-node-exporter from $n? [y/N] " a && [[ "${a,,}" == "y" ]] && multipass exec "$n" -- sudo apt-get purge -y prometheus-node-exporter && echo "Removed." || echo "Aborted."'

[Claude]
sessions = bash "${XDG_CONFIG_HOME:-$HOME/.config}/unix-manager/scripts/claude_sessions.sh"
resume   = bash "${XDG_CONFIG_HOME:-$HOME/.config}/unix-manager/scripts/claude_resume.sh"

[System]
upgrade = sudo apt update && sudo apt upgrade -y
adduser = bash -c 'SCRIPTS="${XDG_CONFIG_HOME:-$HOME/.config}/unix-manager/scripts"; bash "$SCRIPTS/create_user.sh"'
listusers = getent passwd | awk -F: '$3>=1000 && $3<65534 {printf "%-20s uid=%-6s %s\n", $1, $3, $6}'
ufw = bash -c 'SCRIPTS="${XDG_CONFIG_HOME:-$HOME/.config}/unix-manager/scripts"; bash "$SCRIPTS/ufw_manager.sh"'
df    = df -h
mem   = free -h
top   = htop
ports = ss -tlnp

[Unix Program Installer]
mc    = sudo apt update && sudo apt install -y mc
htop  = sudo apt update && sudo apt install -y htop
zip   = sudo apt update && sudo apt install -y zip
unzip = sudo apt update && sudo apt install -y unzip
glow = bash -c 'SCRIPTS="${XDG_CONFIG_HOME:-$HOME/.config}/unix-manager/scripts"; bash "$SCRIPTS/install_glow.sh"'
claude = curl -fsSL https://claude.ai/install.sh | bash
docker = bash -c 'SCRIPTS="${XDG_CONFIG_HOME:-$HOME/.config}/unix-manager/scripts"; bash "$SCRIPTS/install_docker.sh"'
prometheus-node-exporter = bash -c 'SCRIPTS="${XDG_CONFIG_HOME:-$HOME/.config}/unix-manager/scripts"; bash "$SCRIPTS/install_node_exporter.sh"'

[Unix Manager]
update = bash -c 'cd "$HOME/.local/share/unix-manager" && git pull && bash install.sh'
readme = less "$HOME/.local/share/unix-manager/README.md"
