# TUI Launcher — command config
# Format:
#   [Group Name]
#   short_name = full command to run
#
# Lines starting with # are comments and are ignored.

[Docker]
install = bash -c 'SCRIPTS="${XDG_CONFIG_HOME:-$HOME/.config}/unix-manager/scripts"; bash "$SCRIPTS/install_docker.sh"'
ps      = docker ps -a
prune   = docker system prune -f

[Git]
st    = git status
log   = git log --oneline -15
diff  = git diff
push  = git push origin HEAD
ship  = bash -c 'read -rp "Commit message (max 7 words): " m && git add . && git commit -m "$m" && git push origin HEAD'

[Multipass]
list  = multipass list
info  = multipass info --all
shell = bash -c 'multipass list; read -rp "VM name: " n && multipass shell "$n"'
stop  = bash -c 'multipass list; read -rp "VM name: " n && multipass stop "$n"'
new = bash -c 'read -rp "Name: " n; read -rp "CPUs [2]: " c; read -rp "Memory [4G]: " m; read -rp "Disk [8G]: " d; multipass launch --name "$n" --cpus "${c:-2}" --memory "${m:-4G}" --disk "${d:-8G}" && mkdir -p "$HOME/.mp_$n" && multipass mount "$HOME/.mp_$n" "$n:/home/ubuntu/host_drive"'
new + prometheus = bash -c 'read -rp "Name: " n; read -rp "CPUs [2]: " c; read -rp "Memory [4G]: " m; read -rp "Disk [8G]: " d; SCRIPTS="${XDG_CONFIG_HOME:-$HOME/.config}/unix-manager/scripts"; multipass launch --name "$n" --cpus "${c:-2}" --memory "${m:-4G}" --disk "${d:-8G}" && mkdir -p "$HOME/.mp_$n" && multipass mount "$HOME/.mp_$n" "$n:/home/ubuntu/host_drive" && multipass transfer "$SCRIPTS/install_node_exporter.sh" "$n:/tmp/install_node_exporter.sh" && multipass exec "$n" -- bash /tmp/install_node_exporter.sh'
stop all = bash -c 'multipass list; read -rp "Stop ALL VMs? [y/N] " a && [[ "${a,,}" == "y" ]] && multipass stop --all && echo "All VMs stopped." || echo "Aborted."'

[Unix Manager]
update = bash -c 'cd "$HOME/.local/share/unix-manager" && git pull && bash install.sh'
readme = less "$HOME/.local/share/unix-manager/README.md"

[System]
upgrade = sudo apt update && sudo apt upgrade -y
df    = df -h
mem   = free -h
top   = htop
ports = ss -tlnp
